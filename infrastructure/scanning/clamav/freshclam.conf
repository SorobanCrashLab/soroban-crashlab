# FreshClam Configuration for CrashLab
# 
# Automated virus database updates.

# Database directory
DatabaseDirectory /var/lib/clamav

# Update logs
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 10M
LogTime yes
LogVerbose no
LogSyslog no
LogFacility LOG_LOCAL6

# PID file
PidFile /var/run/clamav/freshclam.pid

# Database mirrors
DatabaseMirror database.clamav.net

# Update frequency (checks per day)
Checks 24

# Proxy settings (if needed)
# HTTPProxyServer proxy.example.com
# HTTPProxyPort 3128
# HTTPProxyUsername user
# HTTPProxyPassword pass

# Use compressed database
CompressLocalDatabase no

# Bytecode updates
Bytecode yes

# Notify clamd after update
NotifyClamd /etc/clamav/clamd.conf

# On error, execute script
# OnErrorExecute /usr/local/bin/clamav-error.sh

# On successful update, execute script
# OnUpdateExecute /usr/local/bin/clamav-update.sh

# Outdated database alert
OutdatedAlert yes

# Check for new database on startup
StartupChecks 1

# Private mirror (if using local mirror)
# PrivateMirror mirror.example.com

# DNS TXT record for current database version
DNSDatabaseInfo current.cvd.clamav.net

# Allow supplementary groups
AllowSupplementaryGroups yes