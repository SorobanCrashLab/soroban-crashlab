# ClamAV Daemon Configuration for CrashLab
# 
# Optimized for artifact scanning with performance and security settings.

# General
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 10M
LogTime yes
LogVerbose no
LogSyslog no
LogFacility LOG_LOCAL6

# PID file
PidFile /var/run/clamav/clamd.pid

# Database directory
DatabaseDirectory /var/lib/clamav

# Local socket
LocalSocket /var/run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660

# Network socket (for remote scanning)
TCPSocket 3310
TCPAddr 0.0.0.0

# Performance
MaxThreads 16
MaxQueue 200
IdleTimeout 30
MaxDirectoryRecursion 20
FollowDirectorySymlinks no
FollowFileSymlinks no
CrossFilesystems no

# Limits
MaxScanSize 100M
MaxFileSize 100M
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHwp3 16
MaxRecPpt 16
MaxRecXml 16

# Archive scanning
ScanArchive yes
ArchiveBlockEncrypted no
ArchiveBlockEncryptedReason "Encrypted archives cannot be scanned"

# File types
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes

# Heuristics
HeuristicScanPrecedence no
StructuredDataDetection yes
StructuredMinCreditCardCount 5
StructuredMinSSNCount 5
StructuredSSNFormatNormal yes
StructuredSSNFormatStripped yes

# Bytecode
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

# Official database only
OfficialDatabaseOnly no

# Allow supplementary groups
AllowSupplementaryGroups yes

# On-access scanning (not used for artifact scanning)
# OnAccessMountPath /mnt
# OnAccessIncludePath /mnt
# OnAccessExcludePath /mnt/exclude
# OnAccessPreventWrite yes