name: Per-route performance harness

# Full measurement pass for W5-D09 / #1881: first-load JS, RSC payload bytes,
# hydration proxy, LCP and INP on fixture data. The offline route-size gate
# runs in size-limit.yml; this job adds the server/browser metrics that need a
# running production build.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/scripts/perf-harness*'
      - 'apps/web/perf-budgets.json'
      - '.github/workflows/perf-harness.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-harness-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  perf:
    name: Route budgets (RSC + browser)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js App
        run: pnpm --dir apps/web run build

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm --dir apps/web exec next start -p 3210 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3210/api-docs; then
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in 60s" >&2
          exit 1

      - name: Pre-warm core routes
        run: |
          for route in / /dashboard /runs /runs/run-1024 /analytics /trends /triage /logs; do
            curl -s -o /dev/null "http://127.0.0.1:3210$route"
          done

      # Size and RSC budgets are hard gates. Browser timings are recorded as
      # advisory because synthetic local runs are noisy; Lighthouse remains the
      # hard LCP gate. Pass --enforce-timing to make them blocking.
      - name: Measure routes and enforce budgets
        run: |
          node apps/web/scripts/perf-harness.mjs \
            --base-url http://127.0.0.1:3210 \
            --routes '/,/dashboard,/runs,/runs/[id],/analytics,/trends,/triage,/logs' \
            --samples 3 \
            --browser \
            --check \
            --require-runtime

      - name: Append perf report to job summary
        if: always()
        run: |
          if [ -f apps/web/.next/analyze/perf-report.md ]; then
            cat apps/web/.next/analyze/perf-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload per-route performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-harness-report
          path: |
            apps/web/.next/analyze/perf-report.json
            apps/web/.next/analyze/perf-report.md
          if-no-files-found: ignore

      - name: Stop production server
        if: always()
        run: pkill -f "next start -p 3210" || true
