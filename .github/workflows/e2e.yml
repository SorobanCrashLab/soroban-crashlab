---
name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # nightly run so the axe violation trend is tracked regularly.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: 'Regenerate the visual baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNP_VERSION: '9'
  # Number of shards for the Playwright suite. Derived from measured runtime:
  # full suite ~12 min on 1 runner => 2 shards keeps wall time well under 15 min.
  # Bump to 3+ once suite grows past ~20 min on a single runner.
  E2E_SHARDS: '2'
  # Visual gate ships report-only until the committed baselines have had a run
  # in the pinned container. Set the repository variable VISUAL_ENFORCE=true to
  # turn a screenshot diff into a red build.
  VISUAL_ENFORCE: ${{ vars.VISUAL_ENFORCE }}

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
          retention-days: 1

  e2e:
    name: e2e (chromium, shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run e2e suite (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: pnpm --filter web exec playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: 'true'
          PLAYWRIGHT_RETRIES: '1'
      - name: Upload Playwright traces/videos/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: apps/web/playwright-report
          retention-days: 7
      - name: Upload test results (json/junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}-of-${{ matrix.total }}
          path: apps/web/test-results
          retention-days: 7

  quarantine:
    name: Quarantine list
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Resolve quarantine list
        run: |
          set -eu
          QUARANTINE="apps/web/e2e/quarantine.json"
          if [ ! -f "$QUARANTINE" ]; then
            echo "No quarantine file present; nothing to publish."
            echo "[]" > quarantine-resolved.json
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('$QUARANTINE', 'utf8'));
            const today = new Date().toISOString().slice(0, 10);
            const entries = Array.isArray(raw) ? raw : (raw.entries ?? []);
            const expired = entries.filter(e => e.expiresAt && e.expiresAt < today);
            if (expired.length > 0) {
              console.error('[quarantine] expired entries must be removed:');
              for (const e of expired) console.error(' - ' + e.spec + ' (expired ' + e.expiresAt + ')');
              process.exit(1);
            }
            fs.writeFileSync('quarantine-resolved.json', JSON.stringify(entries, null, 2));
            console.log('[quarantine] active entries=' + entries.length);
          "
      - name: Upload quarantine list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-list
          path: quarantine-resolved.json
          retention-days: 30
      - name: Comment quarantine changes on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let entries = [];
            try { entries = JSON.parse(fs.readFileSync('quarantine-resolved.json', 'utf8')); } catch {}
            const marker = '<!-- e2e-quarantine -->';
            const body = entries.length === 0
              ? `${marker}\n### e2e quarantine\nNo quarantined specs.`
              : `${marker}\n### e2e quarantine (${entries.length})\n` +
                entries.map(e => `- \`${e.spec}\` — expires ${e.expiresAt} — ${e.reason ?? 'no reason'}`).join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

  a11y:
    name: a11y gate (axe + keyboard)
    needs: build
    runs-on: ubuntu-latest
    # Budget: job must add <= 5 min to e2e. The axe + keyboard specs
    # are small and serialized to keep the runtime bounded.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ env.PNP_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run a11y axe + config guardrails specs
        run: pnpm --filter web exec playwright test e2e/a11y/a11y-config.spec.ts e2e/a11y/core-flows.spec.ts
        env:
          CI: 'true'
      - name: Run keyboard triage spec
        run: pnpm --filter web exec playwright test e2e/a11y/keyboard-triage.spec.ts
        env:
          CI: 'true'
      - name: Upload a11y axe HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-axe-reports
          path: apps/web/playwright-report
          retention-days: 30
      - name: Upload a11y results (json/junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: apps/web/test-results
          retention-days: 30
      - name: Summarize a11y violation count
        if: always()
        run: |
          set -eu
          RESULTS="apps/web/test-results/results.json"
          if [ -f "$RESULTS" ]; then
            node -e "
              const r = require('./$RESULTS');
              const specs = r.suites ? r.suites.flatMap(s => s.specs ?? []) : [];
              const failed = specs.filter(s => s.ok === false).length;
              console.log(`[a11y] total specs=${specs.length} failed=${failed}`);
            "
          fi
          echo "axe HTML reports attached as a11y-axe-reports artifact"

  visual:
    name: visual regression (chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Screenshot baselines are only reproducible against a pinned renderer:
    # the browser build, fonts and antialiasing all have to match. The image
    # tag tracks the pinned @playwright/test version in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        # Bootstrap is report-only: a workspace that cannot install must not
        # turn the visual gate red before it can report anything.
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: apps/web/.next
      - name: Run visual suite
        id: visual
        # Report-only during bootstrap; the "Enforce visual gate" step below is
        # what turns a diff into a red build once VISUAL_ENFORCE=true.
        continue-on-error: true
        run: pnpm --filter web exec playwright test --config playwright.visual.config.ts
        env:
          CI: 'true'
      - name: Update visual baselines (manual re-bless)
        if: github.event.inputs.update-visual-baselines == 'true'
        continue-on-error: true
        run: pnpm --filter web exec playwright test --config playwright.visual.config.ts --update-snapshots
        env:
          CI: 'true'
      - name: Enforce visual gate
        if: env.VISUAL_ENFORCE == 'true'
        run: |
          set -eu
          RESULTS="apps/web/test-results-visual/results.json"
          if [ ! -f "$RESULTS" ]; then
            echo "[visual] no results produced; nothing to enforce"
            exit 0
          fi
          node -e "
            const r = require('./$RESULTS');
            let failed = 0, total = 0;
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) { total++; if (!spec.ok) failed++; }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of r.suites ?? []) walk(suite);
            console.log('[visual] total=' + total + ' failed=' + failed);
            if (failed > 0) process.exit(1);
          "
      - name: Upload side-by-side visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/test-results-visual
          retention-days: 14
      - name: Upload re-blessed baselines
        if: github.event.inputs.update-visual-baselines == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots
          retention-days: 14
      - name: Upload visual HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: apps/web/playwright-report-visual
          retention-days: 7