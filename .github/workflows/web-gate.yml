name: Web Gate

# Lean PR gate for the web app (#1819). The retired full CI workflow stays as a
# placeholder in ci.yml; this workflow owns lint, typecheck and unit tests only.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-gate.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/web-gate.yml'

concurrency:
  group: web-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  web-gate:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Set up Node.js (pnpm cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web run lint

      - name: Typecheck application program
        run: pnpm --dir apps/web exec tsc -p tsconfig.json --noEmit

      - name: Typecheck test program
        run: pnpm --dir apps/web exec tsc -p tsconfig.test.json --noEmit

      # Flaky suites are quarantined in apps/web/vitest.config.ts (W5-D07).
      # There is deliberately no retry: a red run must be triaged, not retried away.
      - name: Prepare JUnit output directory
        run: mkdir -p apps/web/test-results

      - name: Unit tests (bounded workers, JUnit report)
        run: pnpm --dir apps/web exec vitest run --maxWorkers=2 --reporter=default --reporter=junit --outputFile="${GITHUB_WORKSPACE}/apps/web/test-results/junit.xml"

      - name: Upload JUnit report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-gate-junit
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A separate, lightweight job reports wall time even when web-gate is killed
  # by its 10-minute timeout (a timed-out job cannot run its own final steps).
  wall-time-report:
    name: wall-time check
    needs: web-gate
    if: always() && github.event_name == 'pull_request' && needs.web-gate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment if the gate exceeded its 10-minute budget
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- web-gate-wall-time -->';
            const BUDGET_MS = 10 * 60 * 1000;
            const { owner, repo } = context.repo;
            const run = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });
            const startedAt = new Date(run.data.run_started_at || run.data.created_at).getTime();
            const elapsedMs = Date.now() - startedAt;
            if (!Number.isFinite(elapsedMs) || elapsedMs <= BUDGET_MS) return;

            const minutes = (elapsedMs / 60000).toFixed(1);
            const body = `${MARKER}\n⏱️ \`web-gate\` took **${minutes} min** on this run, above the 10-minute budget. ` +
              'Check pnpm caching and the bounded Vitest worker count before merging.';
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
