name: Governance suites

# Alert policy schema + routing (#1892), adversarial OIDC (#1893), tenant
# isolation + repository gate (#1894) and audit integrity (#1895).

on:
  pull_request:
    paths:
      - 'ops/alert-policies.yml'
      - 'apps/web/src/lib/notifications/**'
      - 'apps/web/src/lib/auth/**'
      - 'apps/web/src/lib/tenancy/**'
      - 'apps/web/src/lib/audit/**'
      - 'apps/web/src/lib/artifact-store.ts'
      - 'apps/web/src/lib/rbac.ts'
      - '.github/workflows/governance-suites.yml'
  push:
    branches: [main]
    paths:
      - 'ops/alert-policies.yml'

concurrency:
  group: governance-suites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run governance suites
        run: >-
          pnpm --dir apps/web exec vitest run
          src/lib/notifications
          src/lib/auth
          src/lib/tenancy
          src/lib/audit
