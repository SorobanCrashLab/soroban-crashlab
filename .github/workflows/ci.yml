  soroban-example:
    name: Soroban Example (WASM build & size budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/soroban-example
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect contract changes
        id: contract-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD contracts/soroban-example/ || true)
            if [ -n "$DIFF" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/soroban-example
      - name: Run tests
        run: cargo test --all-targets
      - name: Build WASM artifact
        run: cargo build --target wasm32-unknown-unknown --release

  secrets-scan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          VERSION="8.18.2"
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Run Gitleaks
        run: ./gitleaks detect --verbose --redact --config .gitleaks.toml

  ops-scripts-syntax:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/backlog-freshness-review.sh
      - run: bash -n scripts/contracts/build-soroban-example.sh

  e2e:
    needs: [web-lint, web-unit, web-build, web-typecheck]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web-setup

      - name: Get Playwright version for cache key
        id: pw-version
        run: |
          VERSION=$(node -e "const p=require('./package.json');console.log(p.devDependencies['@playwright/test']||'unknown')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw-version.outputs.version }}-${{ runner.os }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (always)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --dir apps/web exec playwright install-deps chromium

      - name: Build Next.js for E2E
        run: pnpm --dir apps/web run build

      - name: Run Playwright E2E tests
        run: pnpm --dir apps/web run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  regression:
    needs: [core, core-features, web-lint, web-unit, web-build, soroban-example]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: contracts/crashlab-core
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --bin crashlab -- regression-suite fixtures/

      - name: Run tests
        run: cargo test --all-targets

      - name: Build WASM artifact
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Record size and enforce budget
        run: |
          bash report-size.sh
          cat target/wasm-size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-example-wasm
          path: contracts/soroban-example/target/wasm32-unknown-unknown/release/soroban_example.wasm
          if-no-files-found: ignore
          retention-days: 14

      # Sticky comment on PRs that touch contract code (patterned after lighthouse.yml)
      - name: Post sticky size-diff comment
        if: github.event_name == 'pull_request' && steps.contract-changes.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- soroban-example-wasm-size -->';
            const path = 'contracts/soroban-example/target/wasm-size-report.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '### 📦 Soroban Contract WASM Size Report\n\n> The artifact size report was not generated.';
            const body = `${MARKER}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
