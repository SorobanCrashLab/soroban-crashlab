name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ops-scripts-syntax:
    name: Ops scripts syntax + env audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -gt 0 ]; then
            bash -n "${scripts[@]}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Environment variable drift audit
        run: node scripts/audit-env.mjs

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks detect --source . --config .gitleaks.toml --verbose

  web-migrations:
    name: Storage migration framework
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration unit + fixture upgrade
        run: node scripts/test-migrations.mjs

  soroban-example:
    name: Soroban Example (WASM build & size budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts/soroban-example
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect contract changes
        id: contract-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD contracts/soroban-example/ || true)
            if [ -n "$DIFF" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/soroban-example

      - name: Run tests
        run: cargo test --all-targets

      - name: Build WASM artifact
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Record size and enforce budget
        run: |
          bash report-size.sh
          cat target/wasm-size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-example-wasm
          path: contracts/soroban-example/target/wasm32-unknown-unknown/release/soroban_example.wasm
          if-no-files-found: ignore
          retention-days: 14

      # Sticky comment on PRs that touch contract code (patterned after lighthouse.yml)
      - name: Post sticky size-diff comment
        if: github.event_name == 'pull_request' && steps.contract-changes.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- soroban-example-wasm-size -->';
            const path = 'contracts/soroban-example/target/wasm-size-report.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '### 📦 Soroban Contract WASM Size Report\n\n> The artifact size report was not generated.';
            const body = `${MARKER}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
