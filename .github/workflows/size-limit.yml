name: Bundle Size Budgets (size-limit)

# Per-route-group budget enforcement. Fails the PR when any route group's
# first-load JS (gzip) exceeds its budget. See apps/web/docs/bundle-budgets.md.
#
# CI wiring decision: a SEPARATE job (not a step inside the build job) is the
# simplest correct option. size-limit needs a fresh `.next` build artifact
# anyway, so reusing the build job's workspace buys nothing and would couple a
# size regression to the build job's red/green signal. Isolating it here keeps
# the size gate's failure clearly attributable to a bundle delta.

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  checks: write

jobs:
  size-limit:
    name: Check per-route-group bundle budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web

      - name: Build Next.js App
        run: pnpm run build
        working-directory: apps/web

      # Fails (non-zero exit) when a route group exceeds its budget and posts a
      # PR comment naming the offending group + its size delta versus the limit.
      - name: Run Size-Limit and fail on budget breach
        uses: andresz1/size-limit-action@v1.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: apps/web
          # fail_on_exceed: true is the action default; explicit for clarity.
          fail_on_exceed: true
