name: Docker Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - 'apps/web/Dockerfile'
      - 'contracts/crashlab-core/Dockerfile'
      - 'contracts/**'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/web/Dockerfile'
      - 'contracts/crashlab-core/Dockerfile'
      - 'contracts/**'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-web-docker:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Web Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-contracts-docker:
    name: Build Contracts Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Contracts Docker Image
        uses: docker/build-push-action@v7
        with:
          context: contracts
          file: contracts/crashlab-core/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
