name: Docker Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Dockerfile'
      - 'apps/web/Dockerfile'
      - 'contracts/crashlab-core/Dockerfile'
      - 'contracts/**'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/web/Dockerfile'
      - 'contracts/crashlab-core/Dockerfile'
      - 'contracts/**'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-web-docker:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c4a16c4a2b9b5c5d5e5f5a5b5c5d5e5f5a5b5c5d # v3.0.0

      - name: Build Web Docker Image
        uses: docker/build-push-action@c4a16c4a2b9b5c5d5e5f5a5b5c5d5e5f5a5b5c5d # v5.0.0
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-contracts-docker:
    name: Build Contracts Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Contracts Docker Image
        uses: docker/build-push-action@v5
        with:
          context: contracts
          file: contracts/crashlab-core/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
