name: Regression Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression-tests:
    name: Run Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e4a16c4a2b9b5c5d5e5f5a5b5c5d5e5f5a5b5c5d # 1.75.0

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@c4a16c4a2b9b5c5d5e5f5a5b5c5d5e5f5a5b5c5d # v2.0.0
        with:
          workspaces: contracts

      - name: Run Regression Tests
        working-directory: contracts
        run: cargo test --workspace --all-targets --release

      - name: Run Fuzz Tests (10 second timeout)
        working-directory: contracts
        run: timeout 10 cargo fuzz run fuzz_target_1 || true
