name: Regression Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression-tests:
    name: Run Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1
        with:
          toolchain: 1.97.1

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@6720f05bc48b77f96918929a9019fb2203ff71f8 # v2.0.0
        with:
          workspaces: contracts

      - name: Run Regression Tests
        working-directory: contracts
        run: cargo test --workspace --all-targets --release

      - name: Run Fuzz Tests (10 second timeout)
        working-directory: contracts
        run: timeout 10 cargo fuzz run fuzz_target_1 || true
