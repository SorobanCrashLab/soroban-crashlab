name: docs-links

# Validates relative and in-repo links (paths and #anchors) in the contributor,
# security, release and ops docs, that the ADR index lists every ADR, and that
# SECURITY.md and .github/SECURITY.md stay identical (#1902, #1903).
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - '.github/workflows/docs-links.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: 22
      - run: node scripts/check-doc-links.mjs
