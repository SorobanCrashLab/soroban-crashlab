name: storage-driver-minio

# Runs the StorageDriver contract suite against a real S3-compatible server
# (#1433). Kept out of the main CI job so routine PRs do not pay the container
# cost — the mocked-S3 path in `storage-driver.test.ts` covers the same
# contract there. This runs nightly and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storage-minio.yml'
      - '.github/workflows/nightly-health.yml'

concurrency:
  group: storage-minio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    outputs:
      outcome: ${{ steps.contract.outcome }}

    services:
      minio:
        # 2026.4.10-photon-5-r0 (alias: latest)
        image: bitnami/minio@sha256:e4a9e29cc120b1c216b9d8370507498e4608ee3e09cb317eb0743605210d0264
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: crashlabtest
          MINIO_ROOT_PASSWORD: crashlabtestsecret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CRASHLAB_STORAGE_DRIVER: s3
      CRASHLAB_S3_ENDPOINT: http://127.0.0.1:9000
      CRASHLAB_S3_REGION: us-east-1
      CRASHLAB_S3_BUCKET: crashlab-artifacts
      CRASHLAB_S3_ACCESS_KEY_ID: crashlabtest
      CRASHLAB_S3_SECRET_ACCESS_KEY: crashlabtestsecret

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the storage contract suite against MinIO
        id: contract
        run: pnpm exec vitest run src/lib/storage/minio-contract.test.ts
      - name: Retry the storage contract suite against MinIO (retry-once)
        id: contract-retry
        if: failure() && steps.contract.outcome == 'failure'
        run: pnpm exec vitest run src/lib/storage/minio-contract.test.ts
      - name: Open or update nightly failure issue
        if: failure() && github.event_name == 'schedule' && steps.contract-retry.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "nightly health: storage-driver-minio";
            const label = "nightly-health";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly MinIO storage-driver contract workflow failed.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Triggered at: ${new Date().toISOString()}`,
              `- Retry outcome: ${process.env.RETRY_OUTCOME || 'not attempted'}`,
              `- Last-green SHA: ${process.env.LAST_GREEN_SHA || 'unknown'}`,
              `- Failure budget (7d red rate): ${process.env.RED_RATE || 'unknown'}`,
              "",
              "Runbook: docs/ops/playbooks/storage-degraded.md (severity and escalation: docs/ops/incident-response.md)",
            ].join("\n");

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "D93F0B",
                  description: "Automated nightly health tracking",
                });
              } else {
                throw error;
              }
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }
      - name: Escalate on failure budget breach
        if: failure() && github.event_name == 'schedule' && steps.contract-retry.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RED_RATE: ${{ needs.budget.outputs.red_rate }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "nightly health: storage-driver-minio";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "nightly-health",
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.title === title);
            if (!existing) return;
            const redRate = parseFloat(process.env.RED_RATE || "0");
            if (redRate > 0.3) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: existing.number,
                labels: ["priority:p0"],
              });
            }

  budget:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      red_rate: ${{ steps.compute.outputs.red_rate }}
    steps:
      - name: Compute rolling 7-day red rate
        id: compute
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "storage-minio.yml",
              created: `>=${since}`,
              per_page: 100,
            });
            const runs = data.workflow_runs.filter((r) => r.event === "schedule");
            const red = runs.filter((r) => r.conclusion === "failure").length;
            const rate = runs.length === 0 ? 0 : red / runs.length;
            core.setOutput("red_rate", rate.toFixed(3));
            core.info(`storage-minio 7d red rate: ${rate.toFixed(3)} (${red}/${runs.length})`);
