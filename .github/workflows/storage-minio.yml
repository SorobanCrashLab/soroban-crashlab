name: storage-driver-minio

# Runs the StorageDriver contract suite against a real S3-compatible server
# (#1433). Kept out of the main CI job so routine PRs do not pay the container
# cost — the mocked-S3 path in `storage-driver.test.ts` covers the same
# contract there. This runs nightly and on demand.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: storage-minio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    services:
      minio:
        # 2026.4.10-photon-5-r0 (alias: latest)
        image: bitnami/minio@sha256:e4a9e29cc120b1c216b9d8370507498e4608ee3e09cb317eb0743605210d0264
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: crashlabtest
          MINIO_ROOT_PASSWORD: crashlabtestsecret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CRASHLAB_STORAGE_DRIVER: s3
      CRASHLAB_S3_ENDPOINT: http://127.0.0.1:9000
      CRASHLAB_S3_REGION: us-east-1
      CRASHLAB_S3_BUCKET: crashlab-artifacts
      CRASHLAB_S3_ACCESS_KEY_ID: crashlabtest
      CRASHLAB_S3_SECRET_ACCESS_KEY: crashlabtestsecret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the storage contract suite against MinIO
        run: pnpm exec vitest run src/lib/storage/minio-contract.test.ts
      - name: Open or update nightly failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "CI failure: storage-driver-minio nightly";
            const label = "ci-failure";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly MinIO storage-driver contract workflow failed.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Triggered at: ${new Date().toISOString()}`,
            ].join("\n");

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: "B60205",
                  description: "Automated CI failure notifications",
                });
              } else {
                throw error;
              }
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100,
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }
