name: release

# Release pipeline (#1901). Policy: docs/releases/policy.md.
#
# On a `vX.Y.Z` tag: changelog from conventional commits, fixture-compat
# evidence against the previous tag, web image + SBOM, image push + keyless
# signing, tag-signature check, and a DRAFT GitHub release a maintainer
# reviews and publishes.
#
# workflow_dispatch is always a dry run: everything except push, sign and
# creating the release; the draft assets are uploaded as the `release-draft`
# artifact instead.
#
# Signing is non-blocking (warnings) until the repository variable
# RELEASE_ENFORCE_SIGNING=true — see docs/releases/checklist.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build the dry run from
        default: main
      version:
        description: Version label used in the dry-run notes
        default: v0.0.0-dryrun

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  ENFORCE_SIGNING: ${{ vars.RELEASE_ENFORCE_SIGNING == 'true' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      previous: ${{ steps.meta.outputs.previous }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: 22

      - name: Resolve version and previous tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$IS_TAG" == true ]]; then
            version="$GITHUB_REF_NAME"
            previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${version}^" 2>/dev/null || true)"
          else
            version="$INPUT_VERSION"
            previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)"
          fi
          [[ -n "$previous" ]] || { echo "::error::no previous vX.Y.Z tag found"; exit 1; }
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: $previous)"

      - name: Check the tag is signed
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if [[ "$(jq -r .object.type <<<"$ref")" != tag ]]; then
            verified=false; reason="lightweight tag (use git tag -s)"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")"
            verified="$(jq -r .verification.verified <<<"$tag")"; reason="$(jq -r .verification.reason <<<"$tag")"
          fi
          if [[ "$verified" != true ]]; then
            msg="Tag $TAG is not a verified signed tag: $reason"
            if [[ "$ENFORCE_SIGNING" == true ]]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg (non-blocking until RELEASE_ENFORCE_SIGNING=true)"
          fi

      - name: Changelog unit tests
        run: node --test scripts/release/*.test.mjs

      - name: Generate release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
        run: |
          mkdir -p dist
          # Commit date, not the clock: the same commit always yields the same notes.
          node scripts/release/changelog.mjs --from "$PREVIOUS" --to HEAD \
            --version "$VERSION" --date "$(git log -1 --format=%cs)" \
            --repo "$GITHUB_REPOSITORY" > dist/CHANGELOG-section.md
          note="docs/releases/upgrade-notes/$VERSION.md"
          {
            echo "> Draft generated by the release workflow — review before publishing."
            echo
            if [[ -f "$note" ]]; then cat "$note"; else
              echo "<!-- No $note found. If this release is breaking or deprecates anything, add one from the template below. -->"
              echo
              cat docs/releases/upgrade-notes/TEMPLATE.md
            fi
            echo
            cat dist/CHANGELOG-section.md
            echo
            echo "## Verification"
            echo
            echo "- Fixture compatibility against \`$PREVIOUS\`: see \`fixture-compat.md\` asset."
            echo "- SBOM: \`sbom.spdx.json\` asset."
            echo "- Image signature: \`cosign verify\` per docs/releases/checklist.md."
          } > dist/release-notes.md
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-notes
          path: dist/

  fixture-compat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts/crashlab-core
      - uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 # v4.0.0
        with:
          node-version: 22
      - name: Previous release fixtures against this engine
        run: |
          mkdir -p dist
          scripts/release/fixture-compat.sh "${{ needs.prepare.outputs.previous }}" dist/fixture-compat.md
          cat dist/fixture-compat.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: fixture-compat
          path: dist/

  image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom
          path: dist/sbom.spdx.json

      - name: Log in to GHCR
        if: env.IS_TAG == 'true'
        continue-on-error: ${{ vars.RELEASE_ENFORCE_SIGNING != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push image
        id: push
        if: env.IS_TAG == 'true'
        continue-on-error: ${{ vars.RELEASE_ENFORCE_SIGNING != 'true' }}
        run: |
          docker push "$IMAGE:$VERSION"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.IS_TAG == 'true' && steps.push.outcome == 'success'
      - name: Sign image (keyless, GitHub OIDC)
        if: env.IS_TAG == 'true' && steps.push.outcome == 'success'
        continue-on-error: ${{ vars.RELEASE_ENFORCE_SIGNING != 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$DIGEST"
          cosign attest --yes --type spdxjson --predicate dist/sbom.spdx.json "$DIGEST"

  draft-release:
    needs: [prepare, fixture-compat, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft GitHub release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$VERSION" --notes-file dist/release-notes.md \
            dist/CHANGELOG-section.md dist/fixture-compat.md dist/sbom.spdx.json
      - name: Upload draft assets (dry run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-draft
          path: dist/
