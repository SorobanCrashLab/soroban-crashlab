<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Soroban CrashLab</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #18181b; }
      main { max-width: 32rem; padding: 2rem; text-align: center; }
      button { min-height: 44px; min-width: 44px; padding: 0.6rem 1.2rem; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0c0c0c; color: #fafafa; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>Cached runs and campaigns remain available. New requests will replay when the connection returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
