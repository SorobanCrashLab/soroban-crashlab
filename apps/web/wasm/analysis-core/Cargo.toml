[package]
name = "analysis-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic WebAssembly analysis kernels for Soroban CrashLab in-browser trace parsing, structural diffing, and security insights (#2318)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
