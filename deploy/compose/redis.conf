# Redis for the reference deployment (#1896). The password is written to
# /run/redis/auth.conf (tmpfs) from the REDIS_PASSWORD secret at start-up.
include /run/redis/auth.conf

bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# RDB snapshots only: one file is the whole dataset, which keeps backup
# (redis-cli --rdb) and restore (replace dump.rdb) simple. Worst-case loss on a
# crash between snapshots is ~1 minute of writes under load.
save 900 1
save 300 10
save 60 1000
appendonly no
dbfilename dump.rdb
rdbchecksum yes

# Disable commands nothing here needs and an attacker would love.
rename-command DEBUG ""
rename-command CONFIG ""
rename-command MODULE ""
