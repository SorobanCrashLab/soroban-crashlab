# Prometheus for the reference deployment (#1896).
# The web app checks this instance from /api/health. Add scrape jobs for the
# app here as metrics endpoints land (W5-I02, #1888); the metrics route is
# token-protected (CRASHLAB_METRICS_SCRAPE_TOKEN) and blocked at the TLS edge.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
