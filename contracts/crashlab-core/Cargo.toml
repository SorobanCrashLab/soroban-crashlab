[package]
name = "crashlab-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
soroban-sdk = { workspace = true, optional = true }
env_logger = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
num_cpus = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
filetime = { workspace = true }
mockito = { workspace = true }

[features]
default = []
host-runner = ["soroban-sdk/testutils"]
rpc-runner = ["dep:reqwest", "dep:tokio"]

[[bin]]
name = "export-corpus"
path = "src/bin/export-corpus.rs"

[[bin]]
name = "import-corpus"
path = "src/bin/import-corpus.rs"

[[bin]]
name = "check-fixtures"
path = "src/bin/check-fixtures.rs"

[[bin]]
name = "lint-fixtures"
path = "src/bin/lint-fixtures.rs"

[[bin]]
name = "crash-index"
path = "src/bin/crash-index.rs"

[[bin]]
name = "export-wasm-hash"
path = "src/bin/export-wasm-hash.rs"
