# Soroban pitfall dictionary — curated value pools for crashlab core mutation.
# Each entry is injected into structurally-aware slots with high probability so that
# every campaign exercises the known-hard edges by default.
#
# Format:
#   schema_version = 1
#   engine_version = "<soroban-engine-version>" # W5-B02 binding
#   [[pools]]
#    name = "..."
#    class = "ttl" | "archival" | "depth" | "metering" | "address" | "sequence"
#    description = "..."
#    reference = "..."
#    values = [...]

schema_version = 1
engine_version = "20.0.0"

# -----------------------------------------------------------------------------
# TL thresholds (Time-to-Live extension boundaries)
# -----------------------------------------------------------------------------

[[pools]]
name = "ttl_min_ledgers"
class = "ttl"
description = "Minimum TTL extension in ledgers (boundary value)."
reference = "Soroban docs: state expiration / TTL extension - minimum ledgers"
values = [1, 2, 5, 10]

[[pools]]
name = "ttl_max_ledgers"
class = "ttl"
description = "Maximum TTL extension in ledgers (boundary value)."
reference = "Soroban docs: state expiration / TTL extension - maximum ledgers"
values = [631000, 631001, 631002]

[[pools]]
name = "ttl_extension_border"
class = "ttl"
description = "TTL extension just below / at the maximum allowed extension."
reference = "Soroban docs: TTLextended - max extension edge"
values = [630999, 631000, 631001]

# -----------------------------------------------------------------------------
# Archival / ledger-sequence edges
# -----------------------------------------------------------------------------

[[pools]]
name = "ledger_sequence_zero"
class = "sequence"
description = "Ledger sequence at zero (genesis / archival edge)."
reference = "Soroban docs: Ledger sequence boundaries"
values = [0, 1]

[[pools]]
name = "ledger_sequence_max"
class = "sequence"
description = "Ledger sequence at u32 max (overflow edge)."
reference = "Soroban docs: Ledger sequence u32 range"
values = [4294967295, 4294967294]

[[pools]]
name = "archival_live_until_border"
class = "archival"
description = "liveUntilLedger values at archival boundary (current ledger border)."
reference = "Soroban docs: archived entry access / restoration"
values = [0, 1, 2]

[[pools]]
name = "archival_restore_border"
class = "archival"
description = "Restore extension just at / below minimum (archival restore footgun)."
reference = "Soroban docs: restore footgun - min restore extension"
values = [0, 1, 2]

# -----------------------------------------------------------------------------
# Recursion / host-fn depth limits
# -----------------------------------------------------------------------------

[[pools]]
name = "depth_limit_minus_one"
class = "depth"
description = "Host-fn recursion depth at limit minus one (last successful call)."
reference = "Soroban docs: host function recursion depth limit"
values = [63, 64]

[[pools]]
name = "depth_limit"
class = "depth"
description = "Host-fn recursion depth at the limit (exceeds on next call)."
reference = "Soroban docs: host function recursion depth limit"
values = [64, 65]

[[pools]]
name = "depth_limit_plus_one"
class = "depth"
description = "Host-fn recursion depth one past the limit (should trap)."
reference = "Soroban docs: host function recursion depth limit"
values = [65, 66, 128]

