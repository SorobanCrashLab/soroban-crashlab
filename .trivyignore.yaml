# Accepted-risk baseline for the Trivy CVE gate in
# .github/workflows/docker-build.yml (#1829).
#
# Every entry here is a CRITICAL/HIGH finding that CI would otherwise
# block. Entries are keyed by advisory ID (so they suppress the same
# finding in both the filesystem scan of pnpm-lock.yaml/Cargo.lock and the
# image scan of the built container) and they all expire on 2027-01-15:
# past that date Trivy stops honoring them and the Docker Build workflow
# goes red until each one is either fixed upstream (dependency or base
# image bump) or re-baselined here with a written justification.
#
# Adding an entry is a deliberate accepted risk, not a config tweak: put
# the reason in `statement` and keep the expiry. Do not delete findings
# to make a build green.

